[package]
name = "eternal-updater"
# Ships inside EternalMonitor-Setup.exe; it has no release version of its own.
version = "0.1.0"
edition = "2021"
publish = false

# No C dependencies: the helper links the CRT statically (build.rs), so the
# only DLLs it imports are Windows system libraries.

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
]
