name: Build Windows Portable Host

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Protoc
        shell: pwsh
        run: |
          choco install protoc --yes --no-progress

      - name: Install FFmpeg via vcpkg
        shell: pwsh
        run: |
          $vcpkgDir = $env:VCPKG_INSTALLATION_ROOT
          echo "VCPKG_ROOT=$vcpkgDir" >> $env:GITHUB_ENV
          vcpkg install ffmpeg:x64-windows

      - name: Build Rust Project
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ env.VCPKG_INSTALLATION_ROOT }}
        run: |
          cargo build --release

      - name: Bundle Portable Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable
          Get-ChildItem -Path "target/release/*.exe" | Copy-Item -Destination portable/
          Get-ChildItem -Path "target/release/*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination portable/
          Get-ChildItem -Path "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination portable/

      - name: Upload Portable Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EternalMonitor-Windows-Portable
          path: portable/
          retention-days: 14
