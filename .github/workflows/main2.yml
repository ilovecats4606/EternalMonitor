name: Build Windows Portable Host

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up FFmpeg Shared SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extracted
          $ffmpegPath = (Get-ChildItem -Path ffmpeg_extracted -Directory | Select-Object -First 1).FullName
          echo "FFMPEG_DIR=$ffmpegPath" >> $env:GITHUB_ENV
          echo "$ffmpegPath\bin" >> $env:GITHUB_PATH

      - name: Build Host Executable
        shell: pwsh
        run: |
          cargo build --release -p eternal-host

      - name: Bundle Portable Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable
          Copy-Item target/release/eternal-host.exe portable/
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" portable/ -ErrorAction SilentlyContinue

      - name: Upload Portable Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EternalMonitor-Windows-Portable
          path: portable/
          retention-days: 14
