name: Build Windows Portable Host

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Build Tools
        shell: pwsh
        run: |
          choco install protoc pkgconfiglite --yes --no-progress

      - name: Set up FFmpeg Dev Libraries
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-7.1-full_build-shared.7z"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.7z
          7z x ffmpeg.7z -y -offmpeg_root
          $ffmpegFolder = (Get-ChildItem -Path ffmpeg_root -Directory | Select-Object -First 1).FullName
          echo "FFMPEG_DIR=$ffmpegFolder" >> $env:GITHUB_ENV
          echo "$ffmpegFolder\bin" >> $env:GITHUB_PATH

      - name: Build Rust Project
        shell: pwsh
        run: |
          cargo build --release

      - name: Bundle Portable Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable
          Get-ChildItem -Path "target/release/*.exe" | Copy-Item -Destination portable/
          Get-ChildItem -Path "target/release/*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination portable/
          Get-ChildItem -Path "$env:FFMPEG_DIR\bin\*.dll" | Copy-Item -Destination portable/

      - name: Upload Portable Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EternalMonitor-Windows-Portable
          path: portable/
          retention-days: 14
